org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
# 本机是 aarch64，AGP 自带的 aapt2 加载 android.jar 会失败，这一行指到原生 aapt2。
# 把路径换成你自己机器上的；x86_64 不需要，整行删掉。
# android.aapt2FromMavenOverride=/path/to/aapt2
