name: 闪退
description: 应用自己退出去、黑屏卡住、点了没反应
title: "[闪退] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先去定音页最下面，找到「上一回崩在这儿」，点「复制」，把这整段粘到下面的「崩溃说明」里。
        如果没有这个东西，跟我说一声，然后说明你的操作是怎么崩溃的就行。

  - type: textarea
    id: what
    attributes:
      label: 崩之前你在做什么
      description: 停在哪个页面、点了哪个按钮、听书听到哪儿。写得越具体越好找。
      placeholder: 在阅读页听书，翻到第十一章，点了一下正文，应用就退回去了。
    validations:
      required: true

  - type: textarea
    id: want
    attributes:
      label: 你期望它怎么做
      description: 想到就写。写了我照着这个方向改。空着也行。
      placeholder: 点正文不该退出去。
    validations:
      required: false

  - type: textarea
    id: stack
    attributes:
      label: 崩溃说明
      description: 定音 → 上一回崩在这儿 → 复制，整段粘进来。没有这个东西就跟我说一声，空着也行。
      render: text

  - type: textarea
    id: how
    attributes:
      label: 怎么重现
      description: 从打开应用开始，一步一步写。第几次出现也说一下。
      placeholder: |
        1. 书房点开一本能正常看的书
        2. 点播放，让它念到第三章
        3. 点一下正文
        第三次的时候退的。
    validations:
      required: true

  - type: input
    id: ver
    attributes:
      label: 版本号
      description: 关于页最下面那行，比如 6.0。
      placeholder: "6.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 手机型号与系统版本
      description: 手机自带的设置里，关于手机那一页。不确定就空着。
      placeholder: 小米 8 SE，Android 10
