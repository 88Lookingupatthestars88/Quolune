name: 听书
description: 念不出来、串音、音色不对、听到一半回跳
title: "[听书] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        听书在阅读页，点一下正文会弹出控制栏。
        没念出来，先去定音 → 声源，看那家提供商接上了没有。

  - type: textarea
    id: what
    attributes:
      label: 出了什么问题
      description: 你看到、听到的是什么。有报错原文就照抄，别改字。
      placeholder: 点播放，控制栏一直转圈，最后弹出「请求被限流（429）」。
    validations:
      required: true

  - type: textarea
    id: want
    attributes:
      label: 你期望它怎么做
      description: 想到就写。写了我照着这个方向改。空着也行。
      placeholder: 念完一句接着念下一句，中间别停那么久。
    validations:
      required: false

  - type: textarea
    id: how
    attributes:
      label: 怎么重现
      description: 从打开应用开始，一步一步写。第几次出现也说一下。
      placeholder: |
        1. 书房点开一本能正常看的书
        2. 点正文，点播放
        3. 念到第三节就停住，不动了
    validations:
      required: true

  - type: input
    id: src
    attributes:
      label: 开的是哪家声源
      description: 定音 → 声源里接上的那一家，名字照抄。自己加的本机引擎写引擎名。
      placeholder: MiniMax

  - type: input
    id: ver
    attributes:
      label: 版本号
      description: 关于页最下面那行，比如 6.0。
      placeholder: "6.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 手机型号与系统版本
      description: 手机自带的设置里，关于手机那一页。不确定就空着。
      placeholder: 小米 8 SE，Android 10

  - type: textarea
    id: extra
    attributes:
      label: 截图或补充
      description: 截图直接拖进来。有别的线索也写这。
